<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Nova — Web Development</title>
<style>
body{ font-family: Segoe UI, sans-serif; margin:0; padding:60px 24px; background:#fafafe; color:#1c1c24; }
.wrap{ max-width:640px; margin:0 auto; text-align:center; }
.wrap h1{ font-size:32px; margin-bottom:8px; }
.wrap p{ color:#6b6b7a; }

/* Pixel Nova AI Assistant — widget styles */
:root{
  --pn-primary:#5b47e0;
  --pn-primary-dark:#4636b8;
  --pn-bg:#ffffff;
  --pn-bubble-bot:#f2f1fb;
  --pn-bubble-user:#5b47e0;
  --pn-text:#1c1c24;
  --pn-text-dim:#6b6b7a;
  --pn-border:#e7e6f2;
  --pn-whatsapp:#25D366;
  --pn-radius:16px;
  --pn-font: 'Segoe UI', system-ui, -apple-system, sans-serif;
}

#pn-launcher{
  position:fixed;
  bottom:24px;
  right:24px;
  width:60px;
  height:60px;
  border-radius:50%;
  background:var(--pn-primary);
  box-shadow:0 8px 24px rgba(91,71,224,0.35);
  border:none;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999999;
  transition:transform .2s ease;
}
#pn-launcher:hover{ transform:scale(1.06); }
#pn-launcher svg{ width:28px; height:28px; }

#pn-launcher .pn-dot{
  position:absolute;
  top:2px; right:2px;
  width:12px; height:12px;
  background:#ff5a5f;
  border:2px solid #fff;
  border-radius:50%;
}

#pn-panel{
  position:fixed;
  bottom:98px;
  right:24px;
  width:360px;
  max-width:calc(100vw - 32px);
  height:520px;
  max-height:calc(100vh - 140px);
  background:var(--pn-bg);
  border-radius:var(--pn-radius);
  box-shadow:0 16px 48px rgba(20,16,60,0.22);
  display:none;
  flex-direction:column;
  overflow:hidden;
  font-family:var(--pn-font);
  z-index:999999;
  border:1px solid var(--pn-border);
}
#pn-panel.pn-open{ display:flex; }

#pn-header{
  background:linear-gradient(135deg, var(--pn-primary), var(--pn-primary-dark));
  color:#fff;
  padding:16px 18px;
  display:flex;
  align-items:center;
  gap:12px;
}
#pn-header .pn-avatar{
  width:38px; height:38px;
  border-radius:50%;
  background:rgba(255,255,255,0.18);
  display:flex; align-items:center; justify-content:center;
  font-weight:700;
  flex-shrink:0;
}
#pn-header .pn-title{ font-weight:600; font-size:15px; line-height:1.2; }
#pn-header .pn-subtitle{ font-size:12px; opacity:.85; display:flex; align-items:center; gap:5px; margin-top:2px;}
#pn-header .pn-status-dot{ width:7px; height:7px; border-radius:50%; background:#4ade80; display:inline-block; }
#pn-close{
  margin-left:auto;
  background:transparent;
  border:none;
  color:#fff;
  opacity:.85;
  cursor:pointer;
  font-size:20px;
  line-height:1;
  padding:4px;
}
#pn-close:hover{ opacity:1; }

#pn-messages{
  flex:1;
  overflow-y:auto;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:10px;
  background:#fbfaff;
}

.pn-row{ display:flex; }
.pn-row.pn-bot{ justify-content:flex-start; }
.pn-row.pn-user{ justify-content:flex-end; }

.pn-bubble{
  max-width:80%;
  padding:10px 13px;
  border-radius:14px;
  font-size:13.5px;
  line-height:1.45;
  white-space:pre-wrap;
}
.pn-bot .pn-bubble{
  background:var(--pn-bubble-bot);
  color:var(--pn-text);
  border-bottom-left-radius:4px;
}
.pn-user .pn-bubble{
  background:var(--pn-bubble-user);
  color:#fff;
  border-bottom-right-radius:4px;
}

.pn-quick-replies{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:2px;
  padding-left:2px;
}
.pn-chip{
  border:1px solid var(--pn-primary);
  color:var(--pn-primary);
  background:#fff;
  padding:7px 12px;
  border-radius:999px;
  font-size:12.5px;
  cursor:pointer;
  transition:background .15s, color .15s;
}
.pn-chip:hover{ background:var(--pn-primary); color:#fff; }

.pn-action-card{
  background:#fff;
  border:1px solid var(--pn-border);
  border-radius:12px;
  padding:12px;
  max-width:85%;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.pn-action-btn{
  display:flex;
  align-items:center;
  gap:8px;
  justify-content:center;
  padding:10px 12px;
  border-radius:9px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  border:none;
  text-decoration:none;
}
.pn-action-btn.pn-primary{ background:var(--pn-primary); color:#fff; }
.pn-action-btn.pn-whatsapp{ background:var(--pn-whatsapp); color:#fff; }
.pn-action-btn.pn-outline{ background:#fff; color:var(--pn-text); border:1px solid var(--pn-border); }

#pn-inputbar{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 12px;
  border-top:1px solid var(--pn-border);
  background:#fff;
}
#pn-input{
  flex:1;
  border:1px solid var(--pn-border);
  border-radius:20px;
  padding:10px 14px;
  font-size:13.5px;
  outline:none;
  font-family:var(--pn-font);
}
#pn-input:focus{ border-color:var(--pn-primary); }
#pn-send{
  background:var(--pn-primary);
  border:none;
  width:38px; height:38px;
  border-radius:50%;
  color:#fff;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}
#pn-send svg{ width:16px; height:16px; }

.pn-typing{
  display:flex;
  gap:4px;
  padding:10px 13px;
  background:var(--pn-bubble-bot);
  border-radius:14px;
  border-bottom-left-radius:4px;
  width:fit-content;
}
.pn-typing span{
  width:6px; height:6px;
  border-radius:50%;
  background:#9b96c9;
  animation:pn-blink 1.2s infinite ease-in-out;
}
.pn-typing span:nth-child(2){ animation-delay:.2s; }
.pn-typing span:nth-child(3){ animation-delay:.4s; }
@keyframes pn-blink{ 0%,80%,100%{opacity:.3;} 40%{opacity:1;} }

@media (max-width:420px){
  #pn-panel{ right:12px; left:12px; width:auto; bottom:88px; }
  #pn-launcher{ right:16px; bottom:16px; }
}

</style>
</head>
<body>
  <div class="wrap">
    <h1>Pixel Nova</h1>
    <p>Web development portfolio — replace this section with your real homepage content.
    Click the chat bubble in the bottom-right corner to try the assistant.</p>
  </div>

<script>
/* ==========================================================================
   Pixel Nova — AI Assistant Widget
   Vanilla JS, no backend, no build step. Drop the script tag in and go.
   All business details you'd want to edit live in PN_CONFIG below.
   ========================================================================== */

const PN_CONFIG = {
  enabled: true,   // <-- SWITCH: set to false to turn the assistant OFF for every visitor. Save + re-upload the file.
  brandName: "Pixel Nova",
  assistantName: "Nova",
  whatsappNumber: "15551234567",       // country code + number, no + or spaces
  bookingUrl: "https://calendly.com/your-link", // your booking page
  greeting:
    "Hi! I'm Nova 👋 I help visitors of Pixel Nova figure out the right web project and get it moving. Want to see what we offer, or jump straight to booking / ordering?",
  services: [
    {
      id: "landing",
      name: "Landing Page",
      blurb: "A single high-converting page — great for launches, campaigns, or a simple online presence.",
      priceHint: "from $250",
    },
    {
      id: "website",
      name: "Full Website",
      blurb: "Multi-page site (home, about, services, contact, blog) built to convert and rank.",
      priceHint: "from $600",
    },
    {
      id: "ecommerce",
      name: "E-commerce Store",
      blurb: "Full online store with product catalog, cart, and checkout.",
      priceHint: "from $1200",
    },
    {
      id: "webapp",
      name: "Custom Web App",
      blurb: "Dashboards, booking systems, portals — anything beyond a standard site.",
      priceHint: "custom quote",
    },
    {
      id: "maintenance",
      name: "Maintenance & Support",
      blurb: "Ongoing updates, fixes, and improvements for an existing site.",
      priceHint: "from $50/mo",
    },
  ],
};

/* ==========================================================================
   Internal state
   ========================================================================== */
const PN_STATE = {
  order: { service: null, name: null, details: null, budget: null },
  step: "idle", // idle | order_service | order_name | order_details | order_budget | order_confirm
};

/* ==========================================================================
   DOM bootstrap — injects markup so you only need one <script> tag
   ========================================================================== */
function pnInit() {
  if (!PN_CONFIG.enabled) return; // switch is OFF — don't create any widget elements

  const launcher = document.createElement("button");
  launcher.id = "pn-launcher";
  launcher.setAttribute("aria-label", "Open chat with " + PN_CONFIG.assistantName);
  launcher.innerHTML = `
    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
    </svg>
    <span class="pn-dot"></span>
  `;
  document.body.appendChild(launcher);

  const panel = document.createElement("div");
  panel.id = "pn-panel";
  panel.innerHTML = `
    <div id="pn-header">
      <div class="pn-avatar">N</div>
      <div>
        <div class="pn-title">${PN_CONFIG.assistantName} · ${PN_CONFIG.brandName}</div>
        <div class="pn-subtitle"><span class="pn-status-dot"></span>Usually replies instantly</div>
      </div>
      <button id="pn-close" aria-label="Close chat">&times;</button>
    </div>
    <div id="pn-messages"></div>
    <div id="pn-inputbar">
      <input id="pn-input" type="text" placeholder="Type a message..." autocomplete="off" />
      <button id="pn-send" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="white"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"></path></svg>
      </button>
    </div>
  `;
  document.body.appendChild(panel);

  launcher.addEventListener("click", () => {
    panel.classList.toggle("pn-open");
    launcher.querySelector(".pn-dot").style.display = "none";
    if (panel.classList.contains("pn-open") && !panel.dataset.started) {
      panel.dataset.started = "1";
      pnBotSay(PN_CONFIG.greeting);
      pnShowMainMenu();
    }
  });
  document.getElementById("pn-close").addEventListener("click", () => panel.classList.remove("pn-open"));

  const input = document.getElementById("pn-input");
  const send = document.getElementById("pn-send");
  const submit = () => {
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    pnUserSay(text);
    pnHandleFreeText(text);
  };
  send.addEventListener("click", submit);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
}

/* ==========================================================================
   Message rendering helpers
   ========================================================================== */
function pnScrollToBottom() {
  const box = document.getElementById("pn-messages");
  box.scrollTop = box.scrollHeight;
}

function pnUserSay(text) {
  const box = document.getElementById("pn-messages");
  const row = document.createElement("div");
  row.className = "pn-row pn-user";
  row.innerHTML = `<div class="pn-bubble"></div>`;
  row.querySelector(".pn-bubble").textContent = text;
  box.appendChild(row);
  pnScrollToBottom();
}

function pnBotSay(text, delayMs = 500) {
  return new Promise((resolve) => {
    const box = document.getElementById("pn-messages");
    const typingRow = document.createElement("div");
    typingRow.className = "pn-row pn-bot";
    typingRow.innerHTML = `<div class="pn-typing"><span></span><span></span><span></span></div>`;
    box.appendChild(typingRow);
    pnScrollToBottom();

    setTimeout(() => {
      typingRow.remove();
      const row = document.createElement("div");
      row.className = "pn-row pn-bot";
      row.innerHTML = `<div class="pn-bubble"></div>`;
      row.querySelector(".pn-bubble").textContent = text;
      box.appendChild(row);
      pnScrollToBottom();
      resolve();
    }, delayMs);
  });
}

function pnAddQuickReplies(options) {
  // options: [{ label, onClick }]
  const box = document.getElementById("pn-messages");
  const wrap = document.createElement("div");
  wrap.className = "pn-quick-replies";
  options.forEach((opt) => {
    const chip = document.createElement("button");
    chip.className = "pn-chip";
    chip.textContent = opt.label;
    chip.addEventListener("click", () => {
      wrap.remove(); // consume the choice so it can't be double-clicked
      pnUserSay(opt.label);
      opt.onClick();
    });
    wrap.appendChild(chip);
  });
  box.appendChild(wrap);
  pnScrollToBottom();
}

function pnAddActionCard(html) {
  const box = document.getElementById("pn-messages");
  const row = document.createElement("div");
  row.className = "pn-row pn-bot";
  const card = document.createElement("div");
  card.className = "pn-action-card";
  card.innerHTML = html;
  row.appendChild(card);
  box.appendChild(row);
  pnScrollToBottom();
}

/* ==========================================================================
   Conversation flow
   ========================================================================== */
function pnShowMainMenu() {
  pnAddQuickReplies([
    { label: "See services", onClick: pnShowServices },
    { label: "Book a call", onClick: pnOfferBooking },
    { label: "Order on WhatsApp", onClick: pnOfferWhatsappOrder },
    { label: "Place an order here", onClick: () => pnStartOrder(null) },
  ]);
}

async function pnShowServices() {
  await pnBotSay("Here's what we do:");
  const box = document.getElementById("pn-messages");
  PN_CONFIG.services.forEach((s) => {
    pnAddActionCard(`
      <div style="font-weight:700;font-size:14px;">${s.name}</div>
      <div style="font-size:12.5px;color:var(--pn-text-dim);">${s.blurb}</div>
      <div style="font-size:12px;color:var(--pn-primary);font-weight:600;">${s.priceHint}</div>
      <button class="pn-action-btn pn-primary" data-service="${s.id}">Order this</button>
    `);
    box.lastChild.querySelector("button").addEventListener("click", () => {
      pnUserSay(`I'd like to order: ${s.name}`);
      pnStartOrder(s.id);
    });
  });
  await pnBotSay("Want to book a call instead, or order straight over WhatsApp?");
  pnAddQuickReplies([
    { label: "Book a call", onClick: pnOfferBooking },
    { label: "Order on WhatsApp", onClick: pnOfferWhatsappOrder },
  ]);
}

async function pnOfferBooking() {
  await pnBotSay("You can grab a slot directly on our booking page:");
  pnAddActionCard(`
    <a class="pn-action-btn pn-primary" href="${PN_CONFIG.bookingUrl}" target="_blank" rel="noopener">Open booking page</a>
  `);
  await pnBotSay("Anything else I can help with?", 400);
  pnShowMainMenu();
}

async function pnOfferWhatsappOrder() {
  await pnBotSay("Sure — this opens WhatsApp with a message already started so we can chat directly:");
  const msg = encodeURIComponent(
    `Hi ${PN_CONFIG.brandName}! I'd like to talk about a web project.`
  );
  pnAddActionCard(`
    <a class="pn-action-btn pn-whatsapp" href="https://wa.me/${PN_CONFIG.whatsappNumber}?text=${msg}" target="_blank" rel="noopener">Open WhatsApp</a>
  `);
  await pnBotSay("Or I can take the order right here instead, if that's easier.", 400);
  pnAddQuickReplies([{ label: "Place order here", onClick: () => pnStartOrder(null) }]);
}

/* ---- In-chat order flow ---- */
function pnStartOrder(serviceId) {
  PN_STATE.order = { service: serviceId, name: null, details: null, budget: null };
  if (serviceId) {
    PN_STATE.step = "order_name";
    const svc = PN_CONFIG.services.find((s) => s.id === serviceId);
    pnBotSay(`Great choice — ${svc.name}. What's your name?`).then(() => {});
  } else {
    PN_STATE.step = "order_service";
    pnBotSay("Happy to take the order here. Which service?").then(() => {
      pnAddQuickReplies(
        PN_CONFIG.services.map((s) => ({
          label: s.name,
          onClick: () => {
            PN_STATE.order.service = s.id;
            PN_STATE.step = "order_name";
            pnBotSay("Got it. What's your name?");
          },
        }))
      );
    });
  }
}

async function pnHandleFreeText(text) {
  switch (PN_STATE.step) {
    case "order_name":
      PN_STATE.order.name = text;
      PN_STATE.step = "order_details";
      await pnBotSay(`Thanks, ${text}! Briefly, what do you need built or changed?`);
      return;
    case "order_details":
      PN_STATE.order.details = text;
      PN_STATE.step = "order_budget";
      await pnBotSay("Got it. What's your rough budget or timeline?");
      return;
    case "order_budget":
      PN_STATE.order.budget = text;
      PN_STATE.step = "order_confirm";
      await pnShowOrderSummary();
      return;
    default:
      await pnHandleGeneralQuestion(text);
      return;
  }
}

async function pnShowOrderSummary() {
  const o = PN_STATE.order;
  const svc = PN_CONFIG.services.find((s) => s.id === o.service);
  await pnBotSay("Here's what I've got — take a look before I send it over:");
  pnAddActionCard(`
    <div style="font-size:13px;line-height:1.6;">
      <b>Service:</b> ${svc ? svc.name : "Not specified"}<br/>
      <b>Name:</b> ${o.name}<br/>
      <b>Details:</b> ${o.details}<br/>
      <b>Budget/timeline:</b> ${o.budget}
    </div>
  `);
  pnAddQuickReplies([
    { label: "✅ Confirm & send", onClick: pnFinalizeOrder },
    { label: "✏️ Start over", onClick: () => pnStartOrder(o.service) },
  ]);
}

function pnFinalizeOrder() {
  const o = PN_STATE.order;
  const svc = PN_CONFIG.services.find((s) => s.id === o.service);
  const lines = [
    `New order via website chat — ${PN_CONFIG.brandName}`,
    `Service: ${svc ? svc.name : "Not specified"}`,
    `Name: ${o.name}`,
    `Details: ${o.details}`,
    `Budget/timeline: ${o.budget}`,
  ];
  const msg = encodeURIComponent(lines.join("\n"));
  const url = `https://wa.me/${PN_CONFIG.whatsappNumber}?text=${msg}`;

  pnBotSay("Perfect — tap below to send this order to us on WhatsApp so we can confirm it with you:").then(() => {
    pnAddActionCard(`
      <a class="pn-action-btn pn-whatsapp" href="${url}" target="_blank" rel="noopener">Send order via WhatsApp</a>
    `);
  });
  PN_STATE.step = "idle";
}

/* ---- Simple keyword-based answers for free-typed questions ---- */
async function pnHandleGeneralQuestion(text) {
  const t = text.toLowerCase();
  if (/(price|cost|how much|budget)/.test(t)) {
    await pnBotSay(
      "Pricing depends on the project — landing pages start around $250, full sites from $600, stores from $1200, and custom apps get a tailored quote. Want to start an order or book a call to get exact numbers?"
    );
    pnShowMainMenu();
  } else if (/(service|offer|do you build|what.*do)/.test(t)) {
    pnShowServices();
  } else if (/(whatsapp)/.test(t)) {
    pnOfferWhatsappOrder();
  } else if (/(book|call|meeting|schedule)/.test(t)) {
    pnOfferBooking();
  } else if (/(order|buy|start|hire)/.test(t)) {
    pnStartOrder(null);
  } else if (/(hi|hello|hey)/.test(t)) {
    await pnBotSay("Hey there! Want to see our services, book a call, or place an order?");
    pnShowMainMenu();
  } else {
    await pnBotSay(
      "I'm best at helping with services, booking, and orders — here's what I can do:"
    );
    pnShowMainMenu();
  }
}

/* ==========================================================================
   Boot
   ========================================================================== */
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", pnInit);
} else {
  pnInit();
}

</script>
</body>
</html>
